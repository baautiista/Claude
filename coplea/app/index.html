<meta charset="utf-8">
<title>Coplea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600&display=swap">
<style>
/* Layout: app móvil de una columna (máx. 460px) con cabecera de estado fija, contenido desplazable y barra de pestañas inferior. Look claro de marca, deliberadamente de un solo tema. */
:root{
  --bg:#F4F8FB; --page:#E3ECF2; --card:#FFFFFF; --ink:#13283A; --mut:#647789; --line:#DCE5EC;
  --blue:#0F6FA8; --blue-d:#0A4D75; --teal:#178A98; --red:#E0442E; --red-d:#9E2B1C;
  --sun:#FFC531; --sun-d:#C9930E; --green:#12A07E; --green-d:#0B6E56; --coral:#C2524C; --coral-l:#FFF1F0;
  --acc:var(--blue); --acc-d:var(--blue-d);
  --font-d:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --font-b:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{max-width:460px;margin:0 auto;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
#app.comarca{--acc:var(--coral);--acc-d:#8E3631}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 10px;background:var(--bg);border-bottom:2px solid var(--line);flex:none}
.stat{display:flex;align-items:center;gap:4px;font-weight:900;font-size:1rem;background:none;border:none;padding:4px 2px;cursor:pointer}
.stat svg{width:24px;height:24px}
.stat.dim{color:#A8B7C3}
.mode{display:flex;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:2px}
.mode button{border:none;background:none;font-weight:900;font-size:.75rem;padding:5px 8px;border-radius:9px;cursor:pointer;color:var(--mut)}
.mode button.on{background:var(--acc);color:#fff}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
.tabs{flex:none;display:flex;justify-content:space-around;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);background:var(--card)}
.tabs button{border:2px solid transparent;background:none;border-radius:12px;width:56px;height:44px;display:grid;place-items:center;cursor:pointer;color:#A8B7C3}
.tabs button svg{width:26px;height:26px}
.tabs button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,#fff);border-color:color-mix(in srgb,var(--acc) 40%,#fff)}
.card{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:14px}
.k{font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.ttl{font-weight:900;font-size:1.15rem;line-height:1.2}
.h1{font-family:var(--font-d);font-weight:400;font-size:1.9rem;line-height:1.05}
.mut{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.m svg{width:100%;height:auto;display:block}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px;font-weight:700}
.btn{font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:.92rem;border:none;cursor:pointer;color:#fff;background:var(--acc);padding:15px 20px;border-radius:16px;box-shadow:0 5px 0 var(--acc-d);transition:transform .08s,box-shadow .08s;width:100%;
  -webkit-mask:radial-gradient(circle 7px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 7px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:0 1px 0 var(--acc-d)}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.btn.sun{background:var(--sun);color:#3B2A00;box-shadow:0 5px 0 var(--sun-d)}
.btn.ghost{background:#fff;color:var(--acc);box-shadow:0 5px 0 #C9D7E2;outline:2px solid #C9D7E2;outline-offset:-2px}
.btn[disabled]{background:#DCE4EA;color:#93A3B1;box-shadow:0 5px 0 #C3CDD5;cursor:not-allowed}
.btn.sm{padding:10px 14px;font-size:.8rem;width:auto}
.bar{height:14px;background:#E3EAF0;border-radius:9px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--green);border-radius:9px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);transition:width .4s cubic-bezier(.3,1.4,.5,1)}
.bar.sun i{background:var(--sun)}

/* map */
.world{border-radius:20px;padding:14px 16px;color:#fff;border-bottom:5px solid rgba(0,0,0,.25)}
.world .k{opacity:.85}
.path{display:flex;flex-direction:column;align-items:center;gap:16px;padding:18px 0 8px;position:relative}
.node{border:none;background:none;cursor:pointer;position:relative;padding:0;display:grid;place-items:center}
.node svg{display:block}
.node[disabled]{cursor:default}
.node .lbl{position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--line);border-radius:9px;padding:2px 8px;font-weight:900;font-size:.68rem;color:var(--acc);white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
.node .ring{position:absolute;inset:-8px;border-radius:50%;border:4px solid var(--acc);opacity:.3}
.chest{width:58px;height:50px;border-radius:14px;display:grid;place-items:center;border:3px solid;border-bottom-width:7px}
.pop{position:absolute;left:12px;right:12px;bottom:84px;z-index:5;background:var(--acc);color:#fff;border-radius:20px;padding:16px;display:grid;gap:12px;box-shadow:0 18px 40px -12px rgba(5,20,35,.5);animation:up .2s ease-out}
.pop .btn{background:#fff;color:var(--acc);box-shadow:0 5px 0 rgba(0,0,0,.2)}
@keyframes up{from{transform:translateY(16px);opacity:0}}
.note{font-size:.8rem;color:var(--mut);text-align:center;padding:4px 10px}

/* lesson */
.lesson{flex:1;display:flex;flex-direction:column;min-height:0}
.l-top{display:flex;align-items:center;gap:12px;padding:16px 16px 6px;flex:none}
.l-top .x{background:none;border:none;color:#93A3B1;cursor:pointer;display:grid;padding:2px}
.l-top .x svg{width:26px;height:26px}
.hearts{display:flex;align-items:center;gap:3px;font-weight:900;color:var(--red)}
.hearts svg{width:26px;height:26px}
.timer{font-family:var(--font-m);font-weight:600;color:#A87700;min-width:42px;text-align:right}
.l-body{flex:1;overflow-y:auto;padding:8px 18px 18px;display:flex;flex-direction:column;gap:16px}
.l-kind{font-size:.75rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.comarca .l-kind{color:var(--coral)}
.l-q{font-size:1.3rem;font-weight:900;line-height:1.25}
.guide{display:flex;align-items:flex-end;gap:8px}
.guide .m{width:82px;flex:none}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{font-size:1.02rem;font-weight:800;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:13px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;line-height:1.25}
.opt .num{flex:none;width:26px;height:26px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:.78rem;color:#93A3B1}
.opt.center{justify-content:center;text-align:center}
.opt.sel{border-color:#7DB9E0;background:#E8F3FB;color:var(--blue)}
.comarca .opt.sel{border-color:#F2B1AC;background:#FFF1F0;color:var(--coral)}
.opt.sel .num{border-color:currentColor;color:inherit}
.opt.done{border-color:#7FD3BC;background:#E3F7F1;color:var(--green-d)}
.opt.fade{opacity:.5}
.opt.bad{border-color:#F2A99E;background:#FCE3DF;color:var(--red-d);animation:shake .3s}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.match .opt{font-size:.92rem;justify-content:center;text-align:center;min-height:58px}
.line{min-height:104px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-bottom:8px;background:repeating-linear-gradient(transparent 0 48px,var(--line) 48px 50px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{font-size:.98rem;font-weight:800;background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:13px;padding:9px 13px;cursor:pointer}
.tile.ghost{visibility:hidden}
.tile.sel{border-color:#7DB9E0;background:#E8F3FB;color:var(--blue)}
.sent{font-size:1.18rem;font-weight:700;line-height:2}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--ink);text-align:center;color:var(--acc);font-weight:900}
.audio{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:18px;padding:14px}
.playb{flex:none;width:60px;height:60px;border-radius:50%;border:none;background:var(--sun);color:#3B2A00;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 var(--sun-d)}
.playb svg{width:28px;height:28px}
.wave{display:flex;align-items:center;gap:3px;height:46px;flex:1}
.wave i{flex:1;background:#4EA6DE;border-radius:3px;height:20%;transition:height .12s}
.l-foot{flex:none;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid #E3EAF0}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,1.2,.4,1)}
.sheet.show{transform:none}
.sheet.ok{background:#D9F5EC;color:var(--green-d)}
.sheet.ko{background:#FCE3DF;color:var(--red-d)}
.sheet .row{align-items:flex-start;gap:12px}
.sheet .m{width:76px;flex:none}
.sheet h4{margin:0 0 2px;font-size:1.25rem;font-weight:900}
.sheet p{margin:0;font-size:.98rem;font-weight:600}
.center-screen{flex:1;display:grid;align-content:center;justify-items:center;text-align:center;gap:16px;padding:24px 20px}
.res{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.res div{border:2px solid;border-radius:14px;padding:8px 12px;font-weight:900;min-width:96px;background:#fff}
.res small{display:block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:7}
.confetti i{position:absolute;top:-12px;width:9px;height:5px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* lists */
.lb{display:grid;gap:4px}
.lb .r{display:grid;grid-template-columns:24px 30px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:12px}
.lb .r.me{background:#E3F0F9;outline:2px solid #9CC8E6}
.lb .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:.8rem}
.lb .xp{font-family:var(--font-m);font-weight:600;font-size:.88rem;font-variant-numeric:tabular-nums}
.zone{border-top:2px dashed;margin:4px 0;position:relative;height:0}
.zone span{position:absolute;right:6px;top:-9px;background:var(--bg);font-size:.62rem;font-weight:900;letter-spacing:.08em;padding:0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:grid;justify-items:center;text-align:center;gap:4px;padding:10px 4px}
.hex{width:54px;height:60px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);color:#fff;font-family:var(--font-d);font-size:1.25rem}
.badge.off .hex{background:#DCE4EA!important;color:#A8B7C3}
.badge b{font-size:.78rem;line-height:1.15}
.item{display:flex;align-items:center;gap:12px}
.item svg{width:34px;height:34px;flex:none}
.price{display:flex;align-items:center;gap:4px;font-weight:900}
.price svg{width:18px;height:18px}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:9;background:var(--ink);color:#fff;font-weight:800;padding:10px 16px;border-radius:12px;font-size:.9rem;animation:up .2s ease-out;max-width:90%;text-align:center}
.field{width:100%;font:inherit;font-weight:800;font-size:1.1rem;padding:14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.field:focus{outline:none;border-color:var(--blue)}
.days{display:flex;gap:6px;justify-content:center}
.days div{display:grid;gap:3px;justify-items:center;font-weight:800;font-size:.72rem;color:var(--mut)}
.days span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#E3EAF0;color:#A8B7C3}
.days span.on{background:#FF9F1C;color:#fff}
.days span svg{width:16px;height:16px}
.confirm{position:absolute;inset:0;z-index:10;background:rgba(10,22,34,.5);display:grid;place-items:center;padding:20px}
.confirm .card{display:grid;gap:12px;max-width:340px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
let uid=0;
const INK="#13283A";

/* ---------- Mascots ---------- */
function eyes(e,lx,rx,y,opt){
  opt=opt||{};
  const eyeOpen=(x,dx,dy)=>`<circle cx="${x}" cy="${y}" r="13" fill="#fff" stroke="${INK}" stroke-width="3"/><circle cx="${x+dx}" cy="${y+dy}" r="7.2" fill="${INK}"/><circle cx="${x+dx-2.6}" cy="${y+dy-3}" r="2.6" fill="#fff"/><circle cx="${x+dx+2.6}" cy="${y+dy+2.4}" r="1.2" fill="#fff"/>`;
  const arc=(x)=>`<path d="M${x-11},${y+3} Q${x},${y-10} ${x+11},${y+3}" fill="none" stroke="${INK}" stroke-width="4.5" stroke-linecap="round"/>`;
  const lash=(x,s)=>opt.lashes?`<path d="M${x+s*9},${y-11} l${s*5},-6 M${x+s*12},${y-7} l${s*6},-3" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`:"";
  let L,R,extra="";
  switch(e){
    case "guino": L=eyeOpen(lx,1,1); R=arc(rx); break;
    case "fiesta": L=arc(lx); R=arc(rx); break;
    case "triste": L=eyeOpen(lx,0,3); R=eyeOpen(rx,0,3);

const HEART_MS=4*3600e3;
function tickHearts(){
  if(S.hearts>=5){S.heartsTs=0;return}
  if(!S.heartsTs) S.heartsTs=Date.now();
  const n=Math.floor((Date.now()-S.heartsTs)/HEART_MS);
  if(n>0){S.hearts=Math.min(5,S.hearts+n);S.heartsTs=S.hearts>=5?0:S.heartsTs+n*HEART_MS}
}
function liveStreak(){
  const t=dayKey(), y=dayKey(addDays(new Date(),-1));
  if(S.lastDay===t||S.lastDay===y) return S.streak;
  return S.freezes>0&&S.lastDay?S.streak:0;
}
function bumpStreak(){
  const t=dayKey(), y=dayKey(addDays(new Date(),-1));
  if(S.lastDay===t) return false;
  if(S.lastDay===y) S.streak++;
  else if(S.lastDay&&S.freezes>0){S.freezes--;S.streak++}
  else S.streak=1;
  S.lastDay=t; if(!S.days.includes(t)) S.days=[...S.days.slice(-30),t];
  return true;
}
function checkWeek(){
  const wk=weekKey();
  if(S.week===wk) return null;
  let msg=null;
  if(S.week){
    const rows=leagueRows(S.week,1,S.weekXp);
    const rank=rows.findIndex(r=>r.me)+1;
    if(rank<=5&&S.league<LEAGUES.length-1){S.league++;msg=`¡Subes a ${LEAGUES[S.league][0]}!`}
    else if(rank>rows.length-3&&S.league>0){S.league--;msg=`Bajas a ${LEAGUES[S.league][0]}. ¡A ensayar!`}
  }
  S.week=wk;S.weekXp=0;save();return msg;
}
function addXp(n){
  if(Date.now()<S.boostUntil) n*=2;
  const t=dayKey(); if(S.xpDay.d!==t) S.xpDay={d:t,xp:0};
  S.xp+=n;S.weekXp+=n;S.xpDay.xp+=n;return n;
}
function addDuros(n){S.duros+=n;S.maxDuros=Math.max(S.maxDuros,S.duros)}
const levelOf=xp=>{let i=0;LEVELS.forEach((l,j)=>{if(xp>=l[0])i=j});return i};
function leagueRows(wk,frac,myXp){
  const base=180+S.league*110;
  const rows=BOTS.map((n,i)=>({n,c:BOT_COLORS[i%BOT_COLORS.length],xp:Math.round(base*(.25+hash(wk+n+S.league)*1.6)*frac)}));
  rows.push({n:(S.name||"Tú")+" (tú)",c:"#0F6FA8",xp:myXp,me:true});
  return rows.sort((a,b)=>b.xp-a.xp);
}
function weekFrac(){const ms=Date.now()-weekStart().getTime();return Math.max(.08,Math.min(1,ms/(7*864e5)))}
function unlocked(l){
  const list=ALL_LESSONS.filter(x=>x.world.region===l.world.region);

}

function finalDate(){
  const now=new Date();
  for(const y of [now.getFullYear(),now.getFullYear()+1]){
    const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
    const fin=addDays(new Date(y,mo-1,da),-51);
    if(fin>=new Date(now.getFullYear(),now.getMonth(),now.getDate())) return fin;
  }
}

let actx=null;
function ac(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();return actx}catch(_){return null}}
function tone(f,t,d,type,vol){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(vol||.18,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+d);o.connect(g).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+d+.02)}
const sfxOk=()=>{if(!S.sound)return;tone(660,0,.12,"triangle");tone(990,.09,.18,"triangle")};
const sfxKo=()=>{if(!S.sound)return;tone(180,0,.22,"sawtooth",.08)};
const sfxWin=()=>{if(!S.sound)return;[523,659,784,1046].forEach((f,i)=>tone(f,i*.11,.22,"triangle"))};
let timers=[];
function stopAudio(){timers.forEach(clearTimeout);timers=[]}
function playRhythm(){
  const c=ac(); if(!c) return; stopAudio();
  const t0=c.currentTime+.05, step=60/112/2, pat="B.C.B.CCB.C.BCC.B.C.B.CCB.CCBB..";
  const bars=[...document.querySelectorAll(".wave i")];
  [...pat].forEach((ch,i)=>{const t=t0+i*step;
    if(ch==="B"){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(45,t+.22);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.32)}
    if(ch==="C"){const n=c.sampleRate*.14,buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);for(let j=0;j<n;j++)d[j]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=buf;const f=c.createBiquadFilter();f.type="highpass";f.frequency.value=1600;const g=c.createGain();g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.001,t+.13);s.connect(f).connect(g).connect(c.destination);s.start(t);s.stop(t+.15)}
    if(ch!==".") timers.push(setTimeout(()=>bars.forEach(b=>b.style.height=(ch==="B"?40+Math.random()*60:20+Math.random()*45)+"%"),(t-c.currentTime)*1000));
  });
  timers.push(setTimeout(()=>bars.forEach(b=>b.style.height="20%"),pat.length*step*1000+200));
}

    ["boost","i-bolt","Doble XP · 15 min",Date.now()<S.boostUntil?"Activo ahora":"Todo lo que ganes, por dos",100,Date.now()<S.boostUntil]
  ];
  shell(`<div class="row between"><div class="h1">Tienda</div><div class="price" style="font-size:1.2rem">${ic("i-duro","width:26px;height:26px")}${fmt(S.duros)}</div></div>
   <div class="k mut">Potenciadores</div>
   ${items.map(([id,i,t,d,p,dis])=>`<div class="card item">${ic(i)}<div style="flex:1;min-width:0"><div style="font-weight:900">${t}</div><div class="mut" style="font-size:.85rem;font-weight:600">${d}</div></div><button class="btn sun sm" type="button" data-buy="${id}" ${dis||S.duros<p?"disabled":""}><span class="price">${ic("i-duro")}${p}</span></button></div>`).join("")}
   <div class="k mut">Tipos para Quillo</div>
   <div class="grid2">${OUTFITS.map(([id,n,p])=>{const own=S.owned.includes(id),on=S.outfit===id;return `<div class="card" style="display:grid;gap:8px;justify-items:center;text-align:center;${on?"border-color:var(--blue)":""}"><div class="m" style="width:100%">${mascot("caballa","feliz",id)}</div><div style="font-weight:900;font-size:.9rem">${n}</div>${own?`<button class="btn ${on?"ghost":""} sm" type="button" data-wear="${id}" ${on?"disabled":""} style="width:100%">${on?"Puesto":"Ponérselo"}</button>`:`<button class="btn sun sm" type="button" data-outfit="${id}" ${S.duros<p?"disabled":""} style="width:100%"><span class="price" style="justify-content:center">${ic("i-duro")}${p}</span></button>`}</div>`}).join("")}</div>
   <p class="note">Ganas duros al terminar lecciones (+5, +10 si no fallas), al abrir bateas (+50) y con el reto diario (+15).</p>`);
}

function perfil(){
  const lv=levelOf(S.xp), nextL=LEVELS[lv+1];
  const tagN={coro:"Corista",comparsa:"Comparsista",chirigota:"Chirigotero",cuarteto:"Cuartetero"};
  const top=Object.entries(S.tags).sort((a,b)=>b[1]-a[1])[0];
  const modal=top?tagN[top[0]]:"Por descubrir";
  const wk=weekStart(); const L7=["L","M","X","J","V","S","D"];
  shell(`<div style="display:grid;justify-items:center;gap:6px;text-align:center">
     <div style="width:112px;height:112px;border-radius:50%;background:#E3F0F9;border:5px solid var(--blue);display:grid;place-items:center;overflow:hidden">${M("caballa","feliz","width:104px")}</div>
     <div class="h1">${esc(S.name)}</div>
     <div class="mut" style="font-weight:800">Nivel ${lv+1} · ${LEVELS[lv][1]}</div>
     <span style="background:var(--red);color:#fff;border-radius:99px;padding:4px 12px;font-weight:900;font-size:.75rem;letter-spacing:.06em">TU MODALIDAD: ${modal.toUpperCase()}</span>
   </div>
   ${nextL?`<div class="card"><div class="row between"><span class="k" style="color:var(--teal)">Hacia «${nextL[1]}»</span><span class="mut" style="font-weight:800;font-size:.85rem">${fmt(S.xp)}/${fmt(nextL[0])}</span></div><div class="bar" style="margin-top:8px"><i style="width:${(S.xp-LEVELS[lv][0])/(nextL[0]-LEVELS[lv][0])*100}%"></i></div></div>`:""}
   <div class="grid2">
     <div class="card"><div class="price" style="font-size:1.3rem">${ic("i-racha","width:26px;height:26px")}${liveStreak()}</div><div class="mut" style="font-weight:700;font-size:.85rem">días de racha</div></div>
     <div class="card"><div class="price" style="font-size:1.3rem">${ic("i-xp","width:26px;height:26px")}${fmt(S.xp)}</div><div class="mut" style="font-weight:700;font-size:.85rem">XP total</div></div>
     <div class="card"><div class="price" style="font-size:1.1rem;color:var(--blue)">${ic("i-trophy","width:24px;height:24px")}${LEAGUES[S.league][0]}</div><div class="mut" style="font-weight:700;font-size:.85rem">liga actual</div></div>
     <div class="card"><div class="price" style="font-size:1.3rem;color:var(--teal)">${ic("i-check","width:24px;height:24px")}${Object.keys(S.done).length}</div><div class="mut" style="font-weight:700;font-size:.85rem">lecciones hechas</div></div>
   </div>
   <div class="card"><div class="k mut" style="margin-bottom:10px">Esta semana</div><div class="days">${L7.map((d,i)=>{const on=S.days.includes(dayKey(addDays(wk,i)));return `<div>${d}<span class="${on?"on":""}">${on?ic("i-check"):""}</span></div>`}).join("")}</div></div>
   <div class="k mut">Insignias</div>
   <div class="grid3">${BADGES.map(b=>{const on=b[4]();return `<div class="card badge${on?"":" off"}" title="${esc(b[2])}"><div class="hex" style="background:${b[3]}">${b[0]}</div><b>${b[1]}</b><span class="mut" style="font-size:.7rem;font-weight:600">${b[2]}</span></div>`}).join("")}</div>
   <div class="card item"><div style="flex:1"><div style="font-weight:900">Sonidos</div><div class="mut" style="font-size:.85rem;font-weight:600">Efectos al acertar y fallar</div></div><button class="btn sm ${S.sound?"":"ghost"}" type="button" data-act="sound">${S.sound?"Activados":"Apagados"}</button></div>
   <button class="btn ghost" type="button" data-act="reset">Borrar mi progreso</button>
   <p class="note">Prototipo de Coplea. Tu progreso se guarda solo en este navegador.</p>`);
}

/* ---------- lesson engine ---------- */
function startLesson(id){
  if(S.hearts<=0){toast("Sin vidas. Haz el reto diario o recárgalas en la tienda.");return}
  const l=lessonById(id);
  L={kind:"lesson",lesson:l,qs:l.qs,queue:l.qs.map((_,i)=>i),pos:0,errors:0,ok:0,total:l.qs.length,who:l.world.region==="comarca"?"concha":"caballa",review:!!S.done[id]};
  pop=null; renderQ();
}
function startDaily(){
  const pool=ALL_LESSONS.filter(l=>unlocked(l)).flatMap(l=>l.qs.filter(q=>["mc","tf","fill"].includes(q.t)));
  const qs=shuffle(pool).slice(0,5);
  L={kind:"daily",qs,queue:qs.map((_,i)=>i),pos:0,errors:0,ok:0,total:5,who:guideWho(),ends:Date.now()+60e3};
  renderQ();
  dailyTimer=setInterval(()=>{const left=Math.max(0,Math.ceil((L.ends-Date.now())/1000));const t=$(".timer");if(t)t.textContent=`0:${String(left).padStart(2,"0")}`;if(left<=0){clearInterval(dailyTimer);finishDaily()}},250);
}
const KINDS={mc:"¿Tú qué dices?",tf:"¿Verdad o mentira?",match:"Pareja de baile",order:"Monta el repertorio",fill:"Afina la letra",audio:"Oído de Falla"};
const SAYS={mc:["Esta te la sabes.","Piénsalo con calma.","Fácil, ¿no?"],tf:["¿Verdad o mentira?","Ojo, que hay trampa… o no."],match:["Toca una de cada lado."],order:["De principio a fin."],fill:["Busca la palabra que falta."],audio:["Dale al botón amarillo y escucha."]};

function renderQ(){
  APP.className=L.who==="concha"?"comarca":"";
  if(L.pos>=L.queue.length) return L.kind==="daily"?finishDaily():finishLesson();
  if(L.kind==="lesson"&&S.hearts<=0) return outOfHearts();
  const q=L.qs[L.queue[L.pos]]; L.sel=null; L.st={};
  let body="";
  if(q.t==="mc"||q.t==="audio"||q.t==="fill"){L.perm=shuffle(q.o.map((_,i)=>i))}
  if(q.t==="audio") body+=`<div class="audio"><button class="playb" type="button" data-act="play" aria-label="Reproducir">${ic("i-play")}</button><div class="wave">${"<i></i>".repeat(24)}</div></div>`;
  if(q.t==="mc"||q.t==="audio") body+=`<div class="opts">${L.perm.map((oi,i)=>`<button class="opt" type="button" data-opt="${oi}"><span class="num">${i+1}</span>${esc(q.o[oi])}</button>`).join("")}</div>`;
  if(q.t==="tf") body+=`<div class="opts two"><button class="opt center" type="button" data-opt="1">Verdad</button><button class="opt center" type="button" data-opt="0">Mentira</button></div>`;
  if(q.t==="fill") body+=`<p class="sent">${esc(q.pre)} <span class="blank" id="blank">&nbsp;</span> ${esc(q.post)}</p><div class="bank">${L.perm.map(oi=>`<button class="tile" type="button" data-fill="${oi}">${esc(q.o[oi])}</button>`).join("")}</div>`;
  if(q.t==="match"){const r=shuffle(q.pairs.map((_,i)=>i));body+=`<div class="match"><div class="col">${q.pairs.map((p,i)=>`<button class="opt" type="button" data-l="${i}">${esc(p[0])}</button>`).join("")}</div><div class="col">${r.map(i=>`<button class="opt" type="button" data-r="${i}">${esc(q.pairs[i][1])}</button>`).join("")}</div></div>`;L.st={left:null,n:0,miss:0}}
  if(q.t==="order"){let s=shuffle(q.tiles.map((_,i)=>i));if(s.every((v,i)=>v===i))s.reverse();body+=`<div class="line" id="line"></div><div class="bank">${s.map(i=>`<button class="tile" type="button" data-t="${i}">${esc(q.tiles[i])}</button>`).join("")}</div>`;L.st={picked:[]}}
  const pct=Math.round(L.ok/L.total*100);
  const right=L.kind==="daily"?`<span class="timer">0:${String(Math.max(0,Math.ceil((L.ends-Date.now())/1000))).padStart(2,"0")}</span>`:`<span class="hearts">${ic("i-vida")}${S.hearts}</span>`;
  APP.innerHTML=`<div class="lesson">
    <div class="l-top"><button class="x" type="button" data-act="quit" aria-label="Salir">${ic("i-x")}</button><div class="bar${L.kind==="daily"?" sun":""}"><i style="width:${pct}%"></i></div>${right}</div>
    <div class="l-body"><div class="l-kind">${L.kind==="daily"?"Coplas rápidas · ":""}${KINDS[q.t]}</div><div class="l-q">${q.t==="fill"?"Completa la frase":esc(q.q)}</div>
     <div class="guide">${M(L.who,q.t==="audio"?"canta":"piensa")}<div class="bubble">${pick(SAYS[q.t])}</div></div>${body}</div>
    <div class="l-foot">${q.t==="match"?`<button class="btn ghost" type="button" disabled>Empareja las ${q.pairs.length}</button>`:`<button class="btn green" type="button" data-act="check" disabled>Comprobar</button>`}</div>
    <div class="sheet" id="sheet"></div></div>`;
}
function setCheck(on){const b=APP.querySelector('[data-act="check"]');if(b)b.disabled=!on}
function feedback(ok,q,answer){
  const idx=L.queue[L.pos];
  if(ok){L.ok++;sfxOk();if(q.tag)S.tags[q.tag]=(S.tags[q.tag]||0)+1;if(q.t==="audio")S.audioOk++}
  else{sfxKo();L.errors++;if(L.kind==="lesson"){if(S.hearts>=5)S.heartsTs=Date.now();S.hearts=Math.max(0,S.hearts-1);L.queue.push(idx)}}
  save();
  const fin=L.who==="concha";
  const title=ok?pick(fin?OK_F:OK):pick(fin?KO_F:KO);
  const sh=$("#sheet");
  sh.className="sheet "+(ok?"ok":"ko");
  sh.innerHTML=`<div class="row">${M(L.who,ok?"guino":"triste")}<div><h4>${title}</h4><p>${!ok&&answer?`La respuesta era <b>${esc(answer)}</b>. `:""}${esc(q.why||"")}</p></div></div><button class="btn ${ok?"green":"red"}" type="button" data-act="next">${ok?"Continuar":"Entendido"}</button>`;
  const h=APP.querySelector(".hearts"); if(h) h.innerHTML=`${ic("i-vida")}${S.hearts}`;
  const bar=APP.querySelector(".l-top .bar i"); if(bar) bar.style.width=Math.round(L.ok/L.total*100)+"%";
  APP.querySelector(".l-foot").style.visibility="hidden";
  APP.querySelectorAll(".l-body button").forEach(b=>b.disabled=true);
  requestAnimationFrame(()=>sh.classList.add("show"));
  sh.querySelector("button").focus({preventScroll:true});
}
function check(){
  const q=L.qs[L.queue[L.pos]];
  if(q.t==="mc"||q.t==="audio"||q.t==="tf"){
    const ans=q.t==="tf"?(q.a?1:0):q.a, ok=L.sel===ans;
    const b=APP.querySelector(`[data-opt="${L.sel}"]`); b.classList.remove("sel"); b.classList.add(ok?"done":"bad");
    feedback(ok,q,q.t==="tf"?(q.a?"Verdad":"Mentira"):q.o[q.a]);
  } else if(q.t==="fill"){feedback(L.sel===q.a,q,q.o[q.a])}
  else if(q.t==="order"){const ok=L.st.picked.length===q.tiles.length&&L.st.picked.every((v,i)=>v===i);feedback(ok,q,q.tiles.join(" → "))}
}
function finishLesson(){
  const l=L.lesson, perfect=L.errors===0, before=badgeSnap();
  const first=!S.done[l.id];
  const xp=addXp(first?10+(perfect?5:0)+L.total*2:5);
  const d=first?(perfect?10:5):0; addDuros(d);
  S.done[l.id]=true; if(perfect)S.perfect++;
  const streakUp=bumpStreak(); save();
  const nb=newBadges(before);
  const acc=Math.round(L.total/(L.total+L.errors)*100);
  sfxWin();
  APP.innerHTML=`<div class="center-screen">
    ${M(L.who,"fiesta","width:200px")}
    <div class="h1" style="color:var(--acc);font-size:2.3rem">${perfect?"¡Sin desafinar!":"¡Lección afinada!"}</div>
    <p class="ttl mut" style="font-size:1rem">${L.who==="concha"?"Fina dice: «Eso, con dos conchas.»":"Quillo dice: «Así se empieza a ganar un Falla.»"}</p>
    <div class="res"><div style="border-color:#FFC531;color:#A87700"><small>XP</small>+${xp}</div><div style="border-color:#12A07E;color:#0B6E56"><small>Precisión</small>${acc}%</div>${d?`<div style="border-color:#C9930E;color:#8A6200"><small>Duros</small>+${d}</div>`:""}<div style="border-color:#FF9F1C;color:#B86200"><small>Racha</small>${S.streak} ${S.streak===1?"día":"días"}</div></div>
    ${streakUp&&S.streak>1?`<p style="font-weight:900;color:#B86200">¡Racha ampliada a ${S.streak} días!</p>`:""}
    ${nb.map(b=>`<div class="card row" style="text-align:left"><div class="hex" style="background:${b[3]};width:44px;height:48px;font-size:1rem">${b[0]}</div><div><div class="k" style="color:var(--teal)">Nueva insignia</div><b>${b[1]}</b></div></div>`).join("")}
    <button class="btn" type="button" data-act="continue" style="max-width:360px">Continuar</button></div>`;
  confetti(); L=null;
}
function finishDaily(){
  clearInterval(dailyTimer);
  if(!L) return;
  const before=badgeSnap(), today=dayKey(), first=S.dailyDay!==today;
  let xp=0,dd=0;
  if(first&&L.ok>0){xp=addXp(L.ok*4);dd=15;addDuros(dd);S.dailyDay=today;S.dailyCount++;S.hearts=Math.min(5,S.hearts+1);if(new Date().getHours()<9)S.early=true;bumpStreak()}
  save(); const nb=newBadges(before);
  if(L.ok>0)sfxWin();
  APP.innerHTML=`<div class="center-screen">
    ${M(L.who,L.ok>=3?"fiesta":"guino","width:180px")}
    <div class="h1" style="color:#A87700">${L.ok}/5 coplas</div>
    <p class="ttl mut" style="font-size:1rem">${first&&L.ok>0?"Reto del día completado: +1 vida.":first?"Hoy no ha salido ninguna. ¡Otra vuelta!":"Ya tenías el reto de hoy. Esto ha sido de práctica."}</p>
    <div class="res"><div style="border-color:#FFC531;color:#A87700"><small>XP</small>+${xp}</div><div style="border-color:#C9930E;color:#8A6200"><small>Duros</small>+${dd}</div></div>
    ${nb.map(b=>`<div class="card row"><div class="hex" style="background:${b[3]};width:44px;height:48px;font-size:1rem">${b[0]}</div><b>${b[1]}</b></div>`).join("")}
    <button class="btn" type="button" data-act="continue" style="max-width:360px">Continuar</button></div>`;
  if(L.ok>=3)confetti(); L=null;
}
function outOfHearts(){
  APP.innerHTML=`<div class="center-screen">${M(L.who,"triste","width:180px")}<div class="h1">Sin vidas</div><p class="ttl mut" style="font-size:1rem">«Hasta las mejores comparsas ensayan cien veces.» Recupera una vida con el reto diario, recárgalas en la tienda o espera: vuelve una cada 4 horas.</p>
  <button class="btn sun" type="button" data-go="reto" style="max-width:360px">Reto diario</button><button class="btn ghost" type="button" data-go="tienda" style="max-width:360px">Ir a la tienda</button></div>`;
  L=null;
}

/* ---------- events ---------- */
APP.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||b.disabled) return;
  const d=b.dataset;
  if(d.go){ if(d.go==="reto"){pop=null;return startDaily()} pop=null;screen=d.go;L=null;return render()}
  if(d.region){S.region=d.region;save();pop=null;return render()}
  if(d.start) return startLesson(d.start);
  if(d.node){
    const l=lessonById(d.node), done=!!S.done[l.id];
    pop=`<div class="pop" style="background:${l.world.color}"><div><div class="k" style="opacity:.85">${l.world.name} · ${l.qs.length} ejercicios</div><div class="ttl">${l.title}</div></div><button class="btn" type="button" data-start="${l.id}">${done?"Repasar · +5 XP":"Empezar · +"+(10+l.qs.length*2)+" XP"}</button></div>`;
    return render();
  }
  if(d.chest){S.chests[d.chest]=true;addDuros(50);save();sfxWin();confetti();toast("¡Batea sorpresa! +50 duros");return render()}
  if(d.buy){
    const price={freeze:200,hearts:350,boost:100}[d.buy]; if(S.duros<price) return;
    S.duros-=price;
    if(d.buy==="freeze")S.freezes++; if(d.buy==="hearts"){S.hearts=5;S.heartsTs=0} if(d.buy==="boost")S.boostUntil=Date.now()+15*60e3;
    save();sfxOk();toast({freeze:"Protector de racha listo",hearts:"Vidas al completo",boost:"Doble XP durante 15 minutos"}[d.buy]);return render();
  }
  if(d.outfit!=null){const o=OUTFITS.find(x=>x[0]===d.outfit);if(S.duros<o[2])return;S.duros-=o[2];S.owned.push(o[0]);S.outfit=o[0];save();sfxWin();toast(`¡${o[1]}!`);return render()}
  if(d.wear!=null){S.outfit=d.wear;save();return render()}
  if(d.act==="sound"){S.sound=!S.sound;save();return render()}
  if(d.act==="reset"){return confirmBox("¿Borrar todo tu progreso? No se puede deshacer.","Borrar",()=>{S=Object.assign({},DEF,{owned:[""],tags:{},done:{},chests:{},days:[]});save();screen="home";render()})}
  if(d.act==="continue"){screen="home";return render()}
  /* in-lesson */
  if(!L) { if(pop&&!e.target.closest(".pop")){pop=null;render()} return }
  const q=L.qs[L.queue[L.pos]];
  if(d.act==="quit"){
    if(L.kind==="daily"){clearInterval(dailyTimer);L=null;screen="home";return render()}
    return confirmBox("¿Te vas en mitad del popurrí? Perderás el avance de esta lección.","Salir",()=>{L=null;screen="mapa";render()});
  }
  if(d.act==="check") return check();
  if(d.act==="next"){L.pos++;stopAudio();return renderQ()}
  if(d.act==="play") return playRhythm();
  if(d.opt!=null){APP.querySelectorAll("[data-opt]").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");L.sel=+d.opt;return setCheck(true)}
  if(d.fill!=null){L.sel=+d.fill;$("#blank").textContent=q.o[L.sel];APP.querySelectorAll("[data-fill]").forEach(x=>x.classList.toggle("sel",x===b));return setCheck(true)}
  if(d.t!=null){
    const i=+d.t, line=$("#line");
    if(b.parentElement.id==="line"){L.st.picked=L.st.picked.filter(v=>v!==i);b.remove();APP.querySelector(`.bank [data-t="${i}"]`).classList.remove("ghost")}
    else{L.st.picked.push(i);b.classList.add("ghost");const c=document.createElement("button");c.type="button";c.className="tile";c.dataset.t=i;c.textContent=q.tiles[i];line.appendChild(c)}
    return setCheck(L.st.picked.length===q.tiles.length);
  }
  if(d.l!=null){APP.querySelectorAll("[data-l]").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");L.st.left=+d.l;return}
  if(d.r!=null){
    if(L.st.left==null){b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),350);return}
    const lb=APP.querySelector(`[data-l="${L.st.left}"]`);
    if(+d.r===L.st.left){[lb,b].forEach(x=>{x.classList.remove("sel");x.classList.add("done");x.disabled=true});L.st.left=null;L.st.n++;tone(520+L.st.n*80,0,.1,"triangle");
      if(L.st.n===q.pairs.length) feedback(L.st.miss<=1,q,null);
    } else {L.st.miss++;sfxKo();[lb,b].forEach(x=>x.classList.add("bad"));setTimeout(()=>[lb,b].forEach(x=>x.classList.remove("bad","sel")),350);L.st.left=null}
  }
});
document.addEventListener("keydown",e=>{
  if(!L) return;
  if(e.key==="Enter"){const n=APP.querySelector('.sheet.show [data-act="next"]')||APP.querySelector('[data-act="check"]:not([disabled])');if(n){e.preventDefault();n.click()}}
  else if(/^[1-4]$/.test(e.key)){const o=APP.querySelectorAll(".l-body .opts .opt")[+e.key-1];if(o&&!o.disabled)o.click()}
});

const weekMsg=S.name?checkWeek():null;
tickHearts(); save(); render();
if(weekMsg) toast(weekMsg);
setInterval(()=>{if(!L&&S.name&&S.hearts<5){const h=S.hearts;tickHearts();if(S.hearts!==h){save();render()}}},60e3);
})();
</script>
